[build]
  command = "npm run build"
  publish = "out"
  # Edge functions live in netlify/edge-functions (the default). Declared
  # explicitly so a `netlify deploy --dir=out` from the repo root always
  # carries them: if geo-currency.ts is missing from a deploy, India
  # silently sees USD.
  edge_functions = "netlify/edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"